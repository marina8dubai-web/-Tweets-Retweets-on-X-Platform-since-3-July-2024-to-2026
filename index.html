 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReferenceX | Marina Murkalieva X Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --slate-50: #f8fafc;
            --slate-900: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }

        .list-row { transition: all 0.1s ease; }
        .list-row:hover { background-color: var(--slate-50); }

        /* Modal Backdrop Blur */
        #previewModal {
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen custom-scrollbar">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="bg-slate-900 p-2 rounded-lg shadow-lg">
                    <i class="fa-brands fa-x-twitter text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase leading-none">ReferenceX</h1>
                    <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">Archive Database</p>
                </div>
            </div>
            
            <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
                <input type="text" id="searchInput" placeholder="Search archive..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none transition-all">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="copyAllLinks()" class="text-[10px] font-black text-slate-500 hover:text-slate-900 uppercase tracking-widest transition-colors">
                    <i class="fa-solid fa-copy mr-1"></i> Copy Filtered
                </button>
                <div class="text-right">
                    <p id="totalCount" class="text-sm font-black leading-none">0</p>
                    <p class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">RECORDS</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-2 mb-8">
            <button onclick="filterByYear('all')" class="year-filter px-5 py-1.5 rounded-full text-[10px] font-black bg-slate-900 text-white shadow-md shadow-slate-200 transition-all" data-year="all">ALL TIME</button>
            <button onclick="filterByYear('2026')" class="year-filter px-5 py-1.5 rounded-full text-[10px] font-black bg-white text-slate-400 border border-slate-200 hover:border-slate-900 hover:text-slate-900 transition-all" data-year="2026">2026</button>
            <button onclick="filterByYear('2025')" class="year-filter px-5 py-1.5 rounded-full text-[10px] font-black bg-white text-slate-400 border border-slate-200 hover:border-slate-900 hover:text-slate-900 transition-all" data-year="2025">2025</button>
            <button onclick="filterByYear('2024')" class="year-filter px-5 py-1.5 rounded-full text-[10px] font-black bg-white text-slate-400 border border-slate-200 hover:border-slate-900 hover:text-slate-900 transition-all" data-year="2024">2024</button>
        </div>

        <!-- Regenerated Table Format -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                        <tr class="bg-slate-50/50 border-b border-slate-200">
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest w-40">Date</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest w-48">LINK</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Content Preview</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest w-32 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="linksBody" class="divide-y divide-slate-100">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="hidden py-32 text-center">
                <i class="fa-solid fa-folder-open text-slate-200 text-5xl mb-4"></i>
                <p class="text-slate-400 font-bold text-sm">No archived references found.</p>
            </div>
        </div>
    </main>

    <!-- Detail Preview Modal -->
    <div id="previewModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="p-8">
                <div class="flex justify-between items-start mb-6">
                    <div class="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-black text-slate-500 uppercase tracking-widest" id="modalType">
                        POST
                    </div>
                    <button onclick="closePreview()" class="text-slate-300 hover:text-slate-900 transition-colors">
                        <i class="fa-solid fa-circle-xmark text-2xl"></i>
                    </button>
                </div>

                <div class="space-y-6">
                    <!-- Data Block -->
                    <div class="border-l-4 border-slate-900 pl-4 py-1">
                        <p id="modalDate" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1"></p>
                        <p id="modalSnippet" class="text-lg font-bold text-slate-900 leading-tight"></p>
                        <p id="modalStatusId" class="text-[11px] font-mono text-slate-500 mt-2"></p>
                    </div>

                    <div class="bg-slate-50 rounded-2xl p-5">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Technical Reference</p>
                        <p id="modalFullLink" class="text-[11px] font-mono text-slate-600 break-all bg-white border border-slate-200 p-3 rounded-xl mb-4"></p>
                        
                        <a id="modalOpenBtn" href="#" target="_blank" class="inline-flex items-center gap-2 text-[11px] font-black text-blue-600 hover:text-blue-800 transition-colors uppercase tracking-widest">
                            Open in new tab <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em]">Marina Murkalieva X Archive</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl text-[10px] font-black uppercase tracking-widest translate-y-24 opacity-0 transition-all duration-300 z-[100]">
        <i class="fa-solid fa-check-circle text-emerald-400 mr-2"></i>

    </div>

        let activeYear = 'all';
        let searchQuery = '';
        let currentlyDisplayed = [];

        function init() {
            renderList();
            setupSearch();
        }

        function getYear(dateStr) {
            const match = dateStr.match(/\d{4}/);
            return match ? match[0] : "";
        }

        function renderList() {
            const body = document.getElementById('linksBody');
            const empty = document.getElementById('emptyState');
            body.innerHTML = '';

            currentlyDisplayed = rawData.filter(item => {
                const year = getYear(item.date);
                const matchesYear = activeYear === 'all' || year === activeYear;
                const matchesSearch = item.date.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     item.url.includes(searchQuery);
                return matchesYear && matchesSearch;
            });

            document.getElementById('totalCount').innerText = currentlyDisplayed.length;

            if (currentlyDisplayed.length === 0) {
                empty.classList.remove('hidden');
                return;
            } else {
                empty.classList.add('hidden');
            }

            currentlyDisplayed.forEach(item => {
                const statusId = item.url.split('/').pop();
                const row = document.createElement('tr');
                row.className = "list-row group border-b border-slate-50";

                row.innerHTML = `
                    <td class="px-6 py-5 whitespace-nowrap">
                        <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">${item.date}</span>
                    </td>
                    <td class="px-6 py-5">
                        <button onclick="openPreview('${statusId}', '${item.date}', '${item.url}', '${item.type}')" 
                                class="text-xs font-black text-slate-900 hover:text-blue-600 transition-colors uppercase tracking-tight">
                            ID: ${statusId}
                        </button>
                    </td>
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-2">
                            <span class="px-1.5 py-0.5 bg-slate-100 rounded text-[9px] font-black text-slate-500 uppercase">${item.type === 'RT' ? '/RT/' : 'POST'}</span>
                            <span class="text-[11px] text-slate-500 truncate max-w-md font-medium">Archived Social Media Record from ${item.date}</span>
                        </div>
                    </td>
                    <td class="px-6 py-5 text-right whitespace-nowrap">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="copyToClipboard('${item.url}')" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 text-slate-400 hover:text-slate-900 hover:bg-slate-200 transition-all">
                                <i class="fa-solid fa-copy text-xs"></i>
                            </button>
                            <a href="${item.url}" target="_blank" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-900 text-white shadow-lg hover:scale-105 transition-transform">
                                <i class="fa-solid fa-external-link text-[10px]"></i>
                            </a>
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function filterByYear(year) {
            activeYear = year;
            document.querySelectorAll('.year-filter').forEach(btn => {
                if (btn.dataset.year === year) {
                    btn.classList.add('bg-slate-900', 'text-white', 'shadow-md');
                    btn.classList.remove('bg-white', 'text-slate-400');
                } else {
                    btn.classList.remove('bg-slate-900', 'text-white', 'shadow-md');
                    btn.classList.add('bg-white', 'text-slate-400');
                }
            });
            renderList();
        }

        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderList();
            });
        }

        /* Modal Logic */
        function openPreview(id, date, url, type) {
            const modal = document.getElementById('previewModal');
            const content = document.getElementById('modalContent');
            
            document.getElementById('modalType').innerText = type === 'RT' ? '/RT/ RETWEET' : 'ARCHIVE POST';
            document.getElementById('modalDate').innerText = date;
            document.getElementById('modalSnippet').innerText = `Content Archive: Verified documentation of a ${type} entry on the X.com platform.`;
            document.getElementById('modalStatusId').innerText = `Status ID: ${id}`;
            document.getElementById('modalFullLink').innerText = url;
            document.getElementById('modalOpenBtn').href = url;

            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closePreview() {
            const modal = document.getElementById('previewModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('opacity-100');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
        }

        /* Utilities */
        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Copied Link");
        }

        function copyAllLinks() {
            const links = currentlyDisplayed.map(i => `${i.date} [${i.type}]: ${i.url}`).join('\n');
            const el = document.createElement('textarea');
            el.value = links;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast(`${currentlyDisplayed.length} Links Copied`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.replace('translate-y-24', 'translate-y-0');
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.replace('translate-y-0', 'translate-y-24');
                toast.classList.replace('opacity-100', 'opacity-0');
            }, 2500);
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('previewModal')) closePreview();
        }

        window.onload = init;
    </script>
