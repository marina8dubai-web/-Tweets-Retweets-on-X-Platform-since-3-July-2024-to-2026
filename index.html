  }

  /* Header */

    border-bottom: 2px solid #111;
    padding-bottom: 20px;
    margin-bottom: 32px;
  }

  .doc-header .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 8px;
  }

  .doc-header h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.3px;
    line-height: 1.1;
  }

  .doc-header p {
    color: #555;
    font-size: 14px;
    margin-top: 6px;
  }

  /* Stats */
  .stats {
    display: flex;
    border: 1px solid #ccc;
    margin-bottom: 28px;
  }

  .stat {
    flex: 1;
    padding: 16px 24px;
    border-right: 1px solid #ccc;
  }

  .stat:last-child { border-right: none; }

  .stat .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 4px;
  }

  .stat .value {
    font-size: 28px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    color: #111;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    align-items: center;
  }

  .search-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #aaa;
    pointer-events: none;
  }

  input[type="search"] {
    background: #fff;
    border: 1px solid #bbb;
    color: #111;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 12px 8px 34px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
    border-radius: 0;
  }

  input[type="search"]:focus { border-color: #111; }

  /* Year filter buttons */
  .year-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .yr-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 16px;
    border: 1px solid #bbb;
    background: #fff;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 0;
    letter-spacing: 0.05em;
  }

  .yr-btn:hover { border-color: #111; color: #111; }
  .yr-btn.active { background: #111; color: #fff; border-color: #111; }

  .btn {
    background: #fff;
    border: 1px solid #bbb;
    color: #333;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    border-radius: 0;
  }

  .btn:hover { background: #111; color: #fff; border-color: #111; }

  /* Results info */
  .results-info {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #888;
    margin-bottom: 12px;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: #666;
    padding: 10px 14px;
    text-align: left;
    border-top: 1px solid #111;
    border-bottom: 1px solid #ccc;
    background: #fafafa;
    position: sticky;
    top: 0;
    z-index: 2;
  }

  tbody tr { border-bottom: 1px solid #ebebeb; }
  tbody tr:hover { background: #f7f7f7; }

  td { padding: 9px 14px; vertical-align: middle; }

  .date-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #666;
    white-space: nowrap;
    font-weight: 600;
  }

  .id-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #111;
    word-break: break-all;
  }

  .id-cell a {
    color: #222;
    text-decoration: underline;
    text-decoration-color: #bbb;
    text-underline-offset: 2px;
  }

  .id-cell a:hover { text-decoration-color: #111; }

    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border: 1px solid #ccc;
    color: #555;
    background: #fafafa;
    white-space: nowrap;
  }

    border-color: #111;
    color: #111;
    background: #f0f0f0;
  }

  .action-cell { text-align: right; white-space: nowrap; }

  .copy-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #aaa;
    background: none;
    border: 1px solid #e0e0e0;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    margin-right: 4px;
  }

  .copy-btn:hover { border-color: #111; color: #111; }

  .open-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #fff;
    background: #111;
    border: 1px solid #111;
    padding: 4px 10px;
    text-decoration: none;
    transition: all 0.15s;
    display: inline-block;
  }

  .open-btn:hover { background: #333; }

    text-align: center;
    padding: 48px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #aaa;
    border-bottom: 1px solid #ebebeb;
  }

  .table-footer {
    border-top: 2px solid #111;
    padding-top: 10px;
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #aaa;
    display: flex;
    justify-content: space-between;

    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 10px 24px;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media print {

    .page { padding: 20px; }
  }

let activeYear = 'all';
let searchQuery = '';
let filtered = [];

function getYear(d) { const m = d.match(/\d{4}/); return m ? m[0] : ''; }

function applyFilters() {
  filtered = DATA.filter(item => {
    const yr = getYear(item.date);
    const matchY = activeYear === 'all' || yr === activeYear;
    const q = searchQuery.toLowerCase();
    const matchQ = !q || item.date.toLowerCase().includes(q) || item.url.toLowerCase().includes(q) || item.type.toLowerCase().includes(q);
    return matchY && matchQ;
  });
  render();
}

function render() {
  const tbody = document.getElementById('tableBody');
  const noResults = document.getElementById('noResults');
  tbody.innerHTML = '';

  document.getElementById('totalCount').textContent = DATA.length;
  document.getElementById('visibleCount').textContent = filtered.length;
  document.getElementById('postCount').textContent = filtered.filter(i => i.type === 'Post').length;
  document.getElementById('rtCount').textContent = filtered.filter(i => i.type === 'RT').length;
  document.getElementById('resultsInfo').textContent = `Showing ${filtered.length} of ${DATA.length} records`;
  document.getElementById('footerCount').textContent = `${filtered.length} records shown`;

  if (filtered.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  filtered.forEach(item => {
    const statusId = item.url.split('/').pop();
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="date-cell">${item.date}</td>
      <td class="id-cell">
        <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.url}</a>
      </td>
      <td>
        <span class="type-badge ${item.type === 'RT' ? 'rt' : ''}">${item.type === 'RT' ? '/RT/' : 'Post'}</span>
      </td>
      <td class="action-cell">
        <button class="copy-btn" onclick="copyLink('${item.url}')">Copy</button>
        <a class="open-btn" href="${item.url}" target="_blank" rel="noopener noreferrer">Open</a>
      </td>`;
    tbody.appendChild(tr);
  });
}

function filterYear(year, btn) {
  activeYear = year;
  document.querySelectorAll('.yr-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => showToast('Link copied'));
}

function copyFiltered() {
  const text = filtered.map(i => `${i.date} [${i.type}]: ${i.url}`).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast(`${filtered.length} links copied`));
}

function resetAll() {
  activeYear = 'all';
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.yr-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[onclick*="all"]').classList.add('active');
  applyFilters();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  applyFilters();
});

applyFilters();
</script>
