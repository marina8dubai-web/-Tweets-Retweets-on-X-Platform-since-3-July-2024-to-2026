<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReferenceX | List Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .list-row:hover {
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen custom-scrollbar">

    <!-- Main Navigation Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-slate-900 p-2 rounded flex items-center justify-center">
                    <i class="fa-brands fa-x-twitter text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-none">ReferenceX</h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Consolidated Database</p>
                </div>
            </div>
            
            <div class="hidden md:flex flex-1 max-w-lg mx-8 relative">
                <input type="text" id="searchInput" placeholder="Search references, dates, or IDs..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="copyAllLinks()" class="text-xs font-bold text-slate-600 hover:text-slate-900 px-3 py-2 transition-colors">
                    <i class="fa-solid fa-copy mr-1.5"></i> COPY ALL
                </button>
                <div class="h-4 w-px bg-slate-200"></div>
                <span class="text-xs font-bold text-slate-400">
                    <span id="totalCount" class="text-slate-900">0</span> ENTRIES
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Dashboard Controls -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0" id="yearFilters">
                <button onclick="filterByYear('all')" class="year-filter whitespace-nowrap px-4 py-1.5 rounded text-xs font-bold bg-slate-900 text-white shadow-sm" data-year="all">ALL</button>
                <button onclick="filterByYear('2026')" class="year-filter whitespace-nowrap px-4 py-1.5 rounded text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:border-slate-400" data-year="2026">2026</button>
                <button onclick="filterByYear('2025')" class="year-filter whitespace-nowrap px-4 py-1.5 rounded text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:border-slate-400" data-year="2025">2025</button>
                <button onclick="filterByYear('2024')" class="year-filter whitespace-nowrap px-4 py-1.5 rounded text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:border-slate-400" data-year="2024">2024</button>
            </div>
            
            <div class="md:hidden relative">
                <input type="text" id="searchInputMobile" placeholder="Search..." 
                    class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm shadow-sm outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
        </div>

        <!-- Table View -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200">
                            <th class="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider w-40">Date</th>
                            <th class="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Reference Link / Status ID</th>
                            <th class="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider w-24 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="linksBody" class="divide-y divide-slate-100">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden py-24 text-center">
                <i class="fa-solid fa-folder-open text-slate-200 text-5xl mb-4"></i>
                <p class="text-slate-400 font-medium text-sm">No references found for this criteria.</p>
            </div>
        </div>
    </main>

    <!-- Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-2.5 rounded-lg shadow-xl text-xs font-bold translate-y-20 opacity-0 transition-all duration-300 z-[100] flex items-center gap-2">
        <i class="fa-solid fa-check-circle text-emerald-400"></i>
        <span id="toastMsg">Copied to clipboard</span>
    </div>

        function init() {
            renderList();
            setupSearch();
        }

        function getYear(dateStr) {
            const match = dateStr.match(/\d{4}/);
            return match ? match[0] : "";
        }

        function renderList() {
            const body = document.getElementById('linksBody');
            const empty = document.getElementById('emptyState');
            body.innerHTML = '';

            const filtered = rawData.filter(item => {
                const year = getYear(item.date);
                const matchesYear = activeYear === 'all' || year === activeYear;
                const matchesSearch = item.date.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     item.url.includes(searchQuery);
                return matchesYear && matchesSearch;
            });

            document.getElementById('totalCount').innerText = filtered.length;

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
                return;
            } else {
                empty.classList.add('hidden');
            }

            // Grouping logic
            let lastHeader = "";

            filtered.forEach(item => {
                const parts = item.date.split(' ');
                const month = parts[0].replace(',', '');
                const year = parts[parts.length - 1];
                const currentHeader = `${month} ${year}`;

                if (currentHeader !== lastHeader) {
                    const separator = document.createElement('tr');
                    separator.className = "bg-slate-50/80";
                    separator.innerHTML = `
                        <td colspan="3" class="px-6 py-2.5 text-[10px] font-black text-slate-500 uppercase tracking-widest border-y border-slate-100 backdrop-blur-sm">
                            ${currentHeader}
                        </td>
                    `;
                    body.appendChild(separator);
                    lastHeader = currentHeader;
                }

                const row = document.createElement('tr');
                row.className = "list-row transition-colors group border-b border-slate-50";
                
                const statusId = item.url.split('/').pop();

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-[11px] font-bold text-slate-500 font-mono">
                        ${item.date}
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-slate-900 group-hover:text-blue-600 transition-colors">ID: ${statusId}</span>
                            <span class="text-[11px] text-slate-400 truncate max-w-lg font-mono mt-0.5">${item.url}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right whitespace-nowrap">
                        <div class="flex items-center justify-end gap-1.5">
                            <button onclick="copyToClipboard('${item.url}')" class="w-7 h-7 flex items-center justify-center rounded bg-slate-50 text-slate-400 hover:text-slate-900 hover:bg-slate-200 transition-all" title="Copy URL">

                            </button>
                            <a href="${item.url}" target="_blank" class="w-7 h-7 flex items-center justify-center rounded bg-slate-100 text-slate-600 hover:text-white hover:bg-slate-900 transition-all shadow-sm" title="Open Link">
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function filterByYear(year) {
            activeYear = year;
            document.querySelectorAll('.year-filter').forEach(btn => {
                if (btn.dataset.year === year) {
                    btn.className = "year-filter whitespace-nowrap px-4 py-1.5 rounded text-xs font-bold bg-slate-900 text-white shadow-sm";
                } else {
                    btn.className = "year-filter whitespace-nowrap px-4 py-1.5 rounded text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:border-slate-400 transition-all";
                }
            });
            renderList();
        }

        function setupSearch() {
            const handler = (e) => {
                searchQuery = e.target.value;
                document.getElementById('searchInput').value = searchQuery;
                document.getElementById('searchInputMobile').value = searchQuery;
                renderList();
            };
            document.getElementById('searchInput').addEventListener('input', handler);
            document.getElementById('searchInputMobile').addEventListener('input', handler);
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Copied to clipboard");
        }

        function copyAllLinks() {
            const links = rawData.map(item => `${item.date}: ${item.url}`).join('\n');
            const el = document.createElement('textarea');
            el.value = links;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Consolidated database copied");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.replace('translate-y-20', 'translate-y-0');
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.replace('translate-y-0', 'translate-y-20');
                toast.classList.replace('opacity-100', 'opacity-0');
            }, 2500);
        }
